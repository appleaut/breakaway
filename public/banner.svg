<svg width="1600" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark green gradient background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a2e1a;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#0d4a2a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a6b4a;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#0d4a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a2e1a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Radial glow -->
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a8a5a;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#0a2e1a;stop-opacity:0" />
    </radialGradient>
    
    <!-- Growth line gradient -->
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0);stop-opacity:0" />
      <stop offset="50%" style="stop-color:rgba(255,255,255,0.3);stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0);stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>
  
  <!-- Radial glow overlay -->
  <rect width="100%" height="100%" fill="url(#glowGradient)"/>
  
  <!-- Concentric growth circles -->
  <circle cx="800" cy="400" r="300" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="800" cy="400" r="220" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <circle cx="800" cy="400" r="140" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="2"/>
  
  <!-- Flowing curved lines -->
  <path d="M100,450 Q400,350 700,400 T1400,350" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <path d="M150,500 Q450,400 750,450 T1350,400" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <path d="M200,380 Q500,280 800,330 T1300,280" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Abstract leaf shapes -->
  <path d="M400,300 Q420,280 440,300 Q420,320 400,300" fill="rgba(255,255,255,0.15)"/>
  <path d="M500,350 Q520,330 540,350 Q520,370 500,350" fill="rgba(255,255,255,0.12)"/>
  <path d="M350,280 Q370,260 390,280 Q370,300 350,280" fill="rgba(255,255,255,0.1)"/>
  
  <!-- Upward growth arrows -->
  <polygon points="500,200 490,220 510,220" fill="rgba(255,255,255,0.15)"/>
  <polygon points="600,180 590,200 610,200" fill="rgba(255,255,255,0.12)"/>
  <polygon points="700,160 690,180 710,180" fill="rgba(255,255,255,0.1)"/>
  
  <!-- Glowing orbs -->
  <circle cx="450" cy="350" r="40" fill="rgba(255,255,255,0.2)" filter="blur(10px)"/>
  <circle cx="550" cy="300" r="30" fill="rgba(255,255,255,0.15)" filter="blur(8px)"/>
  <circle cx="350" cy="280" r="50" fill="rgba(255,255,255,0.1)" filter="blur(15px)"/>
</svg>