<!DOCTYPE html>
<html>
<head>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 1600px;
  height: 800px;
  overflow: hidden;
  background: linear-gradient(135deg, #0a2e1a 0%, #0d4a2a 25%, #1a6b4a 50%, #0d4a2a 75%, #0a2e1a 100%);
  position: relative;
}

/* Abstract growth patterns */
.growth-circle {
  position: absolute;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.1);
}

.growth-circle:nth-child(1) {
  width: 400px;
  height: 400px;
  top: 200px;
  left: 600px;
  border-color: rgba(255, 255, 255, 0.08);
}

.growth-circle:nth-child(2) {
  width: 300px;
  height: 300px;
  top: 250px;
  left: 650px;
  border-color: rgba(255, 255, 255, 0.12);
}

.growth-circle:nth-child(3) {
  width: 200px;
  height: 200px;
  top: 300px;
  left: 700px;
  border-color: rgba(255, 255, 255, 0.16);
}

/* Flowing lines */
.flow-line {
  position: absolute;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
  transform-origin: left center;
}

.flow-line:nth-child(4) {
  width: 600px;
  top: 400px;
  left: 100px;
  transform: rotate(-15deg);
}

.flow-line:nth-child(5) {
  width: 500px;
  top: 350px;
  left: 200px;
  transform: rotate(-10deg);
  opacity: 0.7;
}

.flow-line:nth-child(6) {
  width: 400px;
  top: 450px;
  left: 300px;
  transform: rotate(-20deg);
  opacity: 0.5;
}

/* Leaf-like shapes */
.leaf {
  position: absolute;
  width: 80px;
  height: 40px;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
  border-radius: 50% 0 50% 0;
  transform: rotate(-30deg);
}

.leaf:nth-child(7) {
  top: 300px;
  left: 400px;
}

.leaf:nth-child(8) {
  top: 350px;
  left: 500px;
  transform: rotate(-45deg);
  opacity: 0.7;
}

.leaf:nth-child(9) {
  top: 280px;
  left: 350px;
  transform: rotate(-20deg);
  opacity: 0.5;
}

/* Upward arrows / growth indicators */
.arrow {
  position: absolute;
  width: 0;
  height: 0;
  border-left: 15px solid transparent;
  border-right: 15px solid transparent;
  border-bottom: 30px solid rgba(255, 255, 255, 0.15);
}

.arrow:nth-child(10) {
  top: 200px;
  left: 500px;
}

.arrow:nth-child(11) {
  top: 180px;
  left: 600px;
  opacity: 0.7;
}

.arrow:nth-child(12) {
  top: 160px;
  left: 700px;
  opacity: 0.5;
}

/* Glowing orbs */
.glow {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.3), transparent);
  filter: blur(20px);
}

.glow:nth-child(13) {
  width: 100px;
  height: 100px;
  top: 350px;
  left: 450px;
}

.glow:nth-child(14) {
  width: 80px;
  height: 80px;
  top: 300px;
  left: 550px;
}

.glow:nth-child(15) {
  width: 120px;
  height: 120px;
  top: 280px;
  left: 350px;
  opacity: 0.5;
}

/* Background gradient overlay */
.overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.3) 100%);
  pointer-events: none;
}
</style>
</head>
<body>
  <!-- Growth circles -->
  <div class="growth-circle"></div>
  <div class="growth-circle"></div>
  <div class="growth-circle"></div>
  
  <!-- Flowing lines -->
  <div class="flow-line"></div>
  <div class="flow-line"></div>
  <div class="flow-line"></div>
  
  <!-- Leaf shapes -->
  <div class="leaf"></div>
  <div class="leaf"></div>
  <div class="leaf"></div>
  
  <!-- Growth arrows -->
  <div class="arrow"></div>
  <div class="arrow"></div>
  <div class="arrow"></div>
  
  <!-- Glowing elements -->
  <div class="glow"></div>
  <div class="glow"></div>
  <div class="glow"></div>
  
  <!-- Overlay for depth -->
  <div class="overlay"></div>
</body>
</html>
